<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Moon</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(to bottom,#f7e8d4,#f3d8b5);
            padding:30px;
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            color:#6b3f2d;
            font-size:40px;
        }

        .banner{
            width: 1000px;
            height:900px;
            object-fit:cover;
            border-radius:20px;
            border:5px solid white;
            box-shadow:0 10px 25px rgba(0,0,0,.25);
        }

        .galeria{
            display:flex;
            justify-content:center;
            gap:25px;
            margin-top:35px;
            flex-wrap:wrap;
        }

        .galeria img{
            width:300px;
            height:320px;
            object-fit:cover;
            border-radius:20px;
            border:5px solid white;
            box-shadow:0 8px 20px rgba(0,0,0,.2);
            transition:0.3s;
            cursor:pointer;
        }

        .galeria img:hover{
            transform:scale(1.05);
            box-shadow:0 12px 30px rgba(0,0,0,.35);
        }
    </style>
</head>

<body>

    <h1>🌙 Dark Moon</h1>

    <img class="banner" src="F4.jpg" alt="Dark Moon">

    <div class="galeria">
        <img src="F1.jpg" alt="Jino">
        <img src="F2.jpg" alt="Heli">
        <img src="F3.jpg" alt="Jaan">
    </div>

</body>

</html>
