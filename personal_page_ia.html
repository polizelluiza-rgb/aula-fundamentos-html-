<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Luiza</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #e0f7fa;
            font-family: 'PT Serif', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .bio {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 15px 0;
        }

        h1 {
            font-size: 1.8rem;
            color: #333;
        }

        h2 {
            font-size: 1.3rem;
            margin: 20px 0 10px 0;
            color: #444;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        ul {
            list-style: none;
        }

        li {
            margin: 8px 0;
        }

        ul a {
            text-decoration: none;
            color: #0077b6;
            font-weight: bold;
            transition: color 0.2s;
        }

        ul a:hover {
            color: #0096c7;
            text-decoration: underline;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .logos {
            width: 32px;
            height: 32px;
            transition: transform 0.2s;
        }

        .logos:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <main class="bio">
        <h1>Olá, eu sou a Luiza 👋</h1>
        
        <img src="eu.jpg" alt="Foto de Luiza" class="profile-img">
